<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314233b'/%3E%3Crect x='7' y='11' width='18' height='10' rx='1.5' fill='%23f2b705' transform='rotate(-8 16 16)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Icon sprite: line icons drawn on a 24px grid, used as <svg><use href="#i-name"/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12.5 3 3 5-6.5"/></symbol>
    <symbol id="i-store" viewBox="0 0 24 24"><path d="M3.5 9 5 4h14l1.5 5"/><path d="M4.5 9v11h15V9"/><path d="M3.5 9h17"/><path d="M9.5 20v-6h5v6"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V5"/><circle cx="12" cy="3.5" r="1.5"/><path d="M9 14h.01M15 14h.01"/><path d="M2 13v3M22 13v3"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4 2.5 18a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0z"/><path d="M12 10v4M12 17.5h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-coins" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15v2M11 11v6M15 7v10M19 12v5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="m6 7 1 13h10l1-13"/><path d="M9 7V4h6v3"/><path d="M10 11v6M14 11v6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
  </svg>

  <a class="skip" href="#view">Skip to content</a>

  <aside class="rail" id="rail">
    <a class="brand" href="#/today" aria-label="Agentic desk, go to Dashboard">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">Agentic desk</span>
        <span class="brand-sub">Mission 100 · Group 3</span>
      </span>
    </a>

    <nav class="nav" aria-label="Sections">
      <p class="nav-group">Overview</p>
      <a href="#/today" data-view="today"><span class="nav-icon"><svg class="ico"><use href="#i-dashboard"/></svg></span><span class="nav-label">Dashboard</span></a>

      <p class="nav-group">Agent workflow</p>
      <a href="#/sourcing" data-view="sourcing"><span class="nav-icon"><svg class="ico"><use href="#i-search"/></svg></span><span class="nav-label">Sourcing</span></a>
      <a href="#/approvals" data-view="approvals"><span class="nav-icon"><svg class="ico"><use href="#i-check"/></svg></span><span class="nav-label">Approvals</span><span class="count" id="nav-pending" hidden></span></a>
      <a href="#/ask" data-view="ask"><span class="nav-icon"><svg class="ico"><use href="#i-bot"/></svg></span><span class="nav-label">Ask the agent</span></a>

      <p class="nav-group">Store</p>
      <a href="#/store" data-view="store"><span class="nav-icon"><svg class="ico"><use href="#i-store"/></svg></span><span class="nav-label">Store</span></a>
      <a href="#/price" data-view="price"><span class="nav-icon"><svg class="ico"><use href="#i-tag"/></svg></span><span class="nav-label">Price check</span></a>
      <a href="#/activity" data-view="activity"><span class="nav-icon"><svg class="ico"><use href="#i-activity"/></svg></span><span class="nav-label">Activity</span></a>
    </nav>

    <div class="rail-foot">
      <div class="side-card">
        <p class="side-kicker">Mission progress</p>
        <div class="side-goal"><strong id="side-orders">–</strong><span id="side-goal">of 100 orders</span></div>
        <div class="side-track" role="img" aria-label="Orders toward the goal" id="side-track"><span id="side-fill"></span></div>
        <p class="side-foot" id="side-foot">&nbsp;</p>
      </div>

      <div class="meter" id="meter">
        <div class="meter-head">
          <span>Tokens this week</span>
          <span id="meter-num">–</span>
        </div>
        <div class="meter-track" role="img" aria-label="Token budget used" id="meter-track"><span id="meter-fill"></span></div>
        <div class="meter-foot" id="meter-foot"></div>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="page">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open the menu" aria-controls="rail" aria-expanded="false"><svg class="ico"><use href="#i-menu"/></svg></button>
      <div class="crumbs"><span>Agentic desk</span><span class="crumb-sep" aria-hidden="true">/</span><strong id="crumb">Dashboard</strong></div>
      <div class="top-right">
        <span class="mode" id="mode"><i aria-hidden="true"></i><span id="mode-text">Live desk</span></span>
        <form class="quick-ask" id="quick-ask" role="search">
          <svg class="ico" aria-hidden="true"><use href="#i-bot"/></svg>
          <input type="text" id="quick-ask-input" placeholder="Ask the agent…" aria-label="Ask the agent a question" autocomplete="off">
        </form>
        <a class="icon-btn bell" href="#/approvals" aria-label="Approvals"><svg class="ico"><use href="#i-bell"/></svg><span class="bell-count" id="bell-count" hidden></span></a>
        <span class="avatar" id="avatar" aria-hidden="true">·</span>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/snapshot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
